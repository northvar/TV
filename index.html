<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ทีวีออนไลน์</title>
<style>
  :root{
    --primary:#6D8517; --bg:#111; --surface:#222; --text:#fff;
    --tile:88px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Segoe UI',Tahoma,sans-serif;background:var(--bg);color:var(--text);
    height:100dvh;overflow:hidden;display:flex;flex-direction:column;
  }
  header{background:var(--primary);padding:15px;text-align:center;font-size:1.4rem;font-weight:700}
  footer{background:var(--surface);padding:10px;text-align:center;font-size:.8rem;opacity:.8}

  .categories{display:flex;gap:8px;background:var(--surface);padding:10px;overflow-x:auto;scrollbar-width:none;flex-shrink:0}
  .categories::-webkit-scrollbar{display:none}
  .category{
    padding:10px 20px;background:#333;border:none;color:var(--text);font:inherit;
    border-radius:20px;cursor:pointer;white-space:nowrap;transition:background .2s;
  }
  .category[aria-selected="true"]{background:var(--primary);font-weight:700}

  .channels{
    flex:1;overflow-y:auto;padding:15px;display:grid;align-content:start;gap:20px;
    grid-template-columns:repeat(auto-fill,minmax(var(--tile),1fr));
  }
  .channel{
    display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;
    background:none;border:none;color:inherit;font:inherit;padding:0;transition:transform .2s;
  }
  .channel:hover,.channel:focus-visible{transform:scale(1.06);outline:none}
  .channel:focus-visible .thumb{box-shadow:0 0 0 3px #fff}
  .thumb{
    width:var(--tile);height:var(--tile);object-fit:cover;border-radius:10px;
    border:2px solid var(--primary);background:#333;
  }
  .channel-name{font-size:14px;text-align:center;width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  .empty{grid-column:1/-1;text-align:center;padding:60px 20px;opacity:.65;line-height:1.8}

  .player{position:fixed;inset:0;background:#000;z-index:100;display:none}
  .player[data-open="true"]{display:block}
  .player video{width:100%;height:100%;background:#000}

  .back{
    position:absolute;top:20px;left:20px;width:44px;height:44px;font-size:20px;
    background:rgba(0,0,0,.7);Color:#fff;border:none;border-radius:50%;cursor:pointer;z-index:101;
  }
  .nav-ch{
    position:absolute;right:20px;top:50%;transform:translateY(-50%);
    display:flex;flex-direction:column;gap:14px;z-index:101;
  }
  .nav-ch button{
    width:52px;height:52px;font-size:18px;background:rgba(0,0,0,.7);
    color:#fff;border:none;border-radius:50%;cursor:pointer;transition:background .2s;
  }
  .nav-ch button:hover:not(:disabled){background:var(--primary)}
  .nav-ch button:focus-visible{outline:3px solid #fff;outline-offset:2px}
  .nav-ch button:disabled{opacity:.25;cursor:default}

  .controls {
    position:absolute;left:50%;bottom:20px;transform:translateX(-50%);display:flex;gap:10px;z-index:101;
  }
  .controls button{
    background:rgba(0,0,0,.65);color:#fff;border:none;padding:8px 12px;border-radius:8px;cursor:pointer;
  }

  .back,.nav-ch,.controls{transition:opacity .3s}
  .player[data-idle="true"] .back,
  .player[data-idle="true"] .nav-ch,
  .player[data-idle="true"] .controls{opacity:0;pointer-events:none}

  .spinner{
    position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    width:50px;height:50px;border:5px solid rgba(255,255,255,.3);border-top-color:var(--primary);
    border-radius:50%;animation:spin 1s linear infinite;display:none;
  }
  .spinner[data-on="true"]{display:block}
  .toast{
    position:absolute;bottom:40px;left:50%;transform:translateX(-50%);
    background:rgba(0,0,0,.85);padding:12px 20px;border-radius:8px;display:none;z-index:102;
    max-width:80%;text-align:center;
  }
  .toast[data-on="true"]{display:block}
  .src-info{
    position:absolute;left:20px;bottom:20px;background:rgba(0,0,0,.7);padding:8px 12px;border-radius:8px;font-size:13px;z-index:101;
    max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    transition:opacity .35s ease;
    opacity: 0;
  }
  @keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
</style>
</head>
<body>

<header>ช่องทีวีออนไลน์</header>

<nav class="categories" id="categories" role="tablist"></nav>

<main class="channels" id="grid"></main>

<div class="player" id="player" data-open="false" data-idle="false">
  <video id="video" playsinline controls></video>
  <button class="back" id="back" aria-label="ย้อนกลับ">←</button>

  <div class="nav-ch" role="navigation" aria-label="เปลี่ยนช่อง">
    <button id="prev" aria-label="ช่องก่อนหน้า">▲</button>
    <button id="next" aria-label="ช่องถัดไป">▼</button>
  </div>

  <div class="controls" id="controls">
    <button id="switchSource" aria-label="สลับลิงก์สำรอง">สลับลิงก์</button>
  </div>

  <div class="spinner" id="spinner" data-on="false" aria-hidden="true"></div>
  <div class="toast" id="toast" data-on="false" role="status" aria-live="polite"></div>
  <div class="src-info" id="srcInfo" aria-hidden="true"></div>
</div>

<footer>© 2026 ช่องทีวีออนไลน์</footer>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
<script src="https://cdn.dashjs.org/v4.7.4/dash.all.min.js"></script>
<script>
(() => {
  'use strict';

  const CATEGORIES = [
    { id:'all',         label:'ทั้งหมด' },
    { id:'ทีวีดิจิตอล',   label:'ทีวีดิจิตอล' },
    { id:'news',        label:'ข่าว' },
    { id:'sports',      label:'กีฬา' },
    { id:'movie',       label:'ภาพยนตร์' },
    { id:'kids',        label:'การ์ตูน' },
    { id:'documentary', label:'สารคดี' },
  ];

  let CHANNELS = [];

  const PLACEHOLDER = 'data:image/svg+xml;utf8,' + encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" width="88" height="88"><rect width="88" height="88" fill="%23333"/></svg>'
  );

  const $ = id => document.getElementById(id);
  const grid = $('grid'), tabs = $('categories'), video = $('video');
  const player = $('player'), spinner = $('spinner'), toast = $('toast'), srcInfo = $('srcInfo');
  const navPrev = $('prev'), navNext = $('next'), switchSourceBtn = $('switchSource');

  let current = 'all';
  let hls = null, dash = null;
  let playlist = [], index = -1, idleTimer = null, toastTimer = null;
  let failedAttempts = 0;
  let currentSrcIndex = 0;
  const perSourceRetryLimit = 3;
  const perSourceRetryCounts = new Map();

  // video defaults — เปิดเสียงตั้งแต่ต้นตามคำขอ
  video.muted = false;
  video.crossOrigin = 'anonymous';
  video.preload = 'metadata';

  // restore last channel if available
  const LAST_KEY = 'tv_last_channel';

  async function loadData() {
    try {
      grid.innerHTML = '<p class="empty">กำลังโหลดข้อมูลช่องทีวี...</p>';
      const response = await fetch('channels.json');
      if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
      CHANNELS = await response.json();
      renderTabs();
      renderGrid();
      // restore last
      const saved = localStorage.getItem(LAST_KEY);
      if (saved){
        const { name, category } = JSON.parse(saved);
        if (category) {
          current = category;
          renderTabs();
          renderGrid();
        }
      }
    } catch (error) {
      console.error('loadData', error);
      grid.innerHTML = '<p class="empty" style="color:#ff6b6b;">ไม่สามารถโหลดข้อมูลช่องทีวีได้</p>';
    }
  }

  function renderTabs(){
    tabs.replaceChildren(...CATEGORIES.map(c => {
      const b = document.createElement('button');
      b.className = 'category';
      b.textContent = c.label;
      b.dataset.id = c.id;
      b.setAttribute('role','tab');
      b.setAttribute('aria-selected', String(c.id === current));
      return b;
    }));
  }

  function renderGrid(){
    const list = current === 'all'
      ? CHANNELS
      : CHANNELS.filter(c => c.category === current);

    if (!list.length){
      const p = document.createElement('p');
      p.className = 'empty';
      p.textContent = current === 'all' ? 'ยังไม่มีช่องในระบบ' : 'หมวดนี้ยังไม่มีช่อง';
      grid.replaceChildren(p);
      return;
    }

    grid.replaceChildren(...list.map((ch, i) => {
      const card = document.createElement('button');
      card.className = 'channel';
      card.title = ch.name;

      const img = document.createElement('img');
      img.className = 'thumb';
      img.loading = 'lazy';
      img.alt = ch.name || '';
      img.src = ch.logo || PLACEHOLDER;
      img.addEventListener('error', () => { img.src = PLACEHOLDER; }, { once:true });

      const label = document.createElement('span');
      label.className = 'channel-name';
      label.textContent = ch.name;

      card.append(img, label);
      card.addEventListener('click', () => openChannel(list, i));
      return card;
    }));
  }

  function openChannel(list, i){
    playlist = list;
    index = i;
    failedAttempts = 0;
    currentSrcIndex = 0;
    perSourceRetryCounts.clear();
    start(playlist[index]);
    try { localStorage.setItem(LAST_KEY, JSON.stringify({ name: playlist[index].name, category: current })); } catch(e){}
  }

  function switchBy(step, isAutoSkip = false){
    if (playlist.length < 2) return;
    if (!isAutoSkip) failedAttempts = 0;
    currentSrcIndex = 0;
    index = (index + step + playlist.length) % playlist.length;
    start(playlist[index]);
    if (!isAutoSkip) note(playlist[index].name);
    try { localStorage.setItem(LAST_KEY, JSON.stringify({ name: playlist[index].name, category: current })); } catch(e){}
  }

  function start(ch){
    cleanup();
    player.dataset.open = 'true';
    spinner.dataset.on = 'true';
    toast.dataset.on = 'false';
    navPrev.disabled = navNext.disabled = playlist.length < 2;
    wake();

    const sources = Array.isArray(ch.src) ? ch.src.slice() : [ch.src];
    if (currentSrcIndex >= sources.length) currentSrcIndex = 0;
    const src = sources[currentSrcIndex] || '';

    updateSrcInfo(src, currentSrcIndex, sources.length);

    if (!src) {
      failLink('ไม่มีลิงก์');
      return;
    }

    if (src.includes('.m3u8')) playHls(src, ch);
    else if (src.includes('.mpd')) playDash(src, ch);
    else {
      video.src = src;
      video.addEventListener('loadedmetadata', ready, { once:true });
      video.addEventListener('error', () => handleSourceFailure(ch, src, 'โหลดสตรีมไม่สำเร็จ'), { once:true });
      video.play().catch(()=>{});
    }
  }

  function playHls(src, ch){
    console.log('playHls', src);
    if (window.Hls && Hls.isSupported()){
      hls = new Hls({
        maxBufferLength: 30,
        manifestLoadingMaxRetry: 1,
        fragLoadingMaxRetry: 1
      });
      hls.loadSource(src);
      hls.attachMedia(video);

      const onManifestParsed = () => { video.play().catch(()=>{}); ready(); };
      const onError = (_, d) => {
        console.warn('hls error', d);
        if (!d.fatal) return;
        if (d.type === Hls.ErrorTypes.NETWORK_ERROR) {
          handleSourceFailure(ch, src, 'NETWORK_ERROR');
        } else if (d.type === Hls.ErrorTypes.MEDIA_ERROR) {
          try { hls.recoverMediaError(); } catch(e){ handleSourceFailure(ch, src, 'MEDIA_ERROR'); }
        } else {
          handleSourceFailure(ch, src, 'FATAL');
        }
      };

      hls.on(Hls.Events.MANIFEST_PARSED, onManifestParsed);
      hls.on(Hls.Events.ERROR, onError);
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
      video.src = src;
      video.addEventListener('loadedmetadata', ready, { once:true });
      video.addEventListener('error', () => handleSourceFailure(ch, src, 'native error'), { once:true });
      video.play().catch(()=>{});
    } else {
      handleSourceFailure(ch, src, 'เบราว์เซอร์ไม่รองรับ HLS');
    }
  }

  function playDash(src, ch){
    console.log('playDash', src);
    if (typeof dashjs === 'undefined') {
      handleSourceFailure(ch, src, 'ไม่พบตัวเล่น DASH');
      return;
    }
    dash = dashjs.MediaPlayer().create();
    dash.initialize(video, src, true);
    dash.on(dashjs.MediaPlayer.events.STREAM_INITIALIZED, ready);
    dash.on(dashjs.MediaPlayer.events.ERROR, () => handleSourceFailure(ch, src, 'DASH ERROR'));
  }

  // show src-info while loading; hide when ready (fade out)
  function updateSrcInfo(src, cur, total){
    srcInfo.textContent = `${cur+1}/${total} ${shorten(src, 80)}`;
    srcInfo.setAttribute('aria-hidden', 'false');
    srcInfo.style.opacity = '1';
  }

  const ready = () => {
    spinner.dataset.on = 'false';
    failedAttempts = 0;
    // fade-out and then hide/clear
    srcInfo.style.opacity = '0';
    setTimeout(() => {
      srcInfo.setAttribute('aria-hidden', 'true');
      srcInfo.textContent = '';
      srcInfo.style.opacity = '';
    }, 400);
  };

  function handleSourceFailure(ch, src, reason){
    console.warn('handleSourceFailure', ch.name, src, reason);
    spinner.dataset.on = 'false';
    note(`ลิงก์มีปัญหา: ${reason}`);
    const key = `${ch.name}||${src}`;
    const count = (perSourceRetryCounts.get(key) || 0) + 1;
    perSourceRetryCounts.set(key, count);

    if (count <= perSourceRetryLimit) {
      const delay = 500 * Math.pow(2, count - 1);
      note(`กำลังลองใหม่ (${count}/${perSourceRetryLimit})...`);
      setTimeout(() => start(ch), delay);
      return;
    }

    const sources = Array.isArray(ch.src) ? ch.src : [ch.src];
    if (currentSrcIndex < sources.length - 1) {
      currentSrcIndex++;
      note('สลับไปใช้ลิงก์สำรอง...');
      setTimeout(() => start(ch), 700);
      return;
    }

    failedAttempts++;
    if (playlist.length < 2 || failedAttempts >= playlist.length) {
      note('ลิงก์เสียทั้งหมด - ปิดใน 2 วินาที');
      setTimeout(close, 2000);
    } else {
      note('ลิงก์เสียทั้งหมด - ข้ามช่องอัตโนมัติ...');
      setTimeout(() => {
        if (player.dataset.open === 'true') switchBy(1, true);
      }, 1500);
    }
  }

  function failLink(msg){
    spinner.dataset.on = 'false';
    note(msg);
    const ch = playlist[index];
    const sources = Array.isArray(ch.src) ? ch.src : [ch.src];
    if (currentSrcIndex < sources.length - 1) {
      currentSrcIndex++;
      note(`ลิงก์หลักเสีย กำลังโหลดสำรอง...`);
      setTimeout(() => start(ch), 1500);
    } else {
      handleSourceFailure(ch, sources[currentSrcIndex] || '', 'ทั้งหมดล้มเหลว');
    }
  }

  function shorten(str, len){
    if (!str) return '';
    return str.length > len ? str.slice(0, len-3) + '...' : str;
  }

  function note(msg){
    clearTimeout(toastTimer);
    toast.textContent = msg;
    toast.dataset.on = 'true';
    toastTimer = setTimeout(() => { toast.dataset.on = 'false'; }, 3000);
  }

  function wake(){
    player.dataset.idle = 'false';
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => { player.dataset.idle = 'true'; }, 3000);
  }

  function cleanup(){
    try {
      video.pause();
      video.removeAttribute('src');
      video.load();
    } catch(e){}
    if (hls){ try { hls.destroy(); } catch(e){} hls = null; }
    if (dash){ try { dash.reset(); } catch(e){} dash = null; }
    srcInfo.textContent = '';
    srcInfo.style.opacity = '';
    srcInfo.setAttribute('aria-hidden', 'true');
  }

  function close(){
    cleanup();
    player.dataset.open = 'false';
    player.dataset.idle = 'false';
    spinner.dataset.on = 'false';
    toast.dataset.on = 'false';
    clearTimeout(idleTimer);
    clearTimeout(toastTimer);
    playlist = []; index = -1;
    failedAttempts = 0;
    currentSrcIndex = 0;
  }

  // manual switch source
  switchSourceBtn.addEventListener('click', () => {
    if (index < 0 || !playlist.length) return;
    const ch = playlist[index];
    const sources = Array.isArray(ch.src) ? ch.src : [ch.src];
    currentSrcIndex = (currentSrcIndex + 1) % sources.length;
    perSourceRetryCounts.clear();
    note('สลับไปยังลิงก์: ' + (currentSrcIndex + 1));
    start(ch);
  });

  tabs.addEventListener('click', e => {
    const tab = e.target.closest('.category');
    if (!tab) return;
    current = tab.dataset.id;
    renderTabs();
    renderGrid();
  });

  $('back').addEventListener('click', close);
  navPrev.addEventListener('click', () => switchBy(-1));
  navNext.addEventListener('click', () => switchBy(1));

  player.addEventListener('mousemove', wake);
  player.addEventListener('touchstart', wake, { passive:true });

  document.addEventListener('keydown', e => {
    if (player.dataset.open !== 'true') return;
    wake();
    if (e.key === 'Escape') close();
    else if (e.key === 'ArrowUp'   || e.key === 'PageUp')   { e.preventDefault(); switchBy(-1); }
    else if (e.key === 'ArrowDown' || e.key === 'PageDown') { e.preventDefault(); switchBy(1);  }
  });

  // Media Session integration
  if ('mediaSession' in navigator) {
    try {
      navigator.mediaSession.setActionHandler('previoustrack', () => switchBy(-1));
      navigator.mediaSession.setActionHandler('nexttrack', () => switchBy(1));
      navigator.mediaSession.metadata = new MediaMetadata({ title: 'ช่องทีวีออนไลน์' });
    } catch(e){}
  }

  const obs = new MutationObserver(() => {
    if (toast.dataset.on === 'true') {
      toast.setAttribute('aria-hidden', 'false');
    } else {
      toast.setAttribute('aria-hidden', 'true');
    }
  });
  obs.observe(toast, { attributes:true, attributeFilter:['data-on'] });

  function logError(...args){ console.error(...args); }

  loadData();
})();
</script>
</body>
</html>
